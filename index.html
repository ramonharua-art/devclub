<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pendaftaran DevClub - SMK Tunas Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">

        <h2 class="text-2xl font-bold text-sky-400 text-center mb-1">
            Pendaftaran DevClub 2026
        </h2>

        <p class="text-xs text-slate-400 text-center mb-6">
            Konsentrasi Keahlian RPL SMK Tunas Media
        </p>

        <form id="formDaftar" class="space-y-4">

            <!-- NIS -->
            <div>
                <label
                    for="nis"
                    class="block text-xs font-semibold uppercase mb-1 text-slate-300">
                    NIS (8 Digit)
                </label>

                <input
                    type="text"
                    id="nis"
                    required
                    maxlength="8"
                    inputmode="numeric"
                    placeholder="Contoh: 20261012"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">

                <span
                    id="errNis"
                    class="text-xs text-red-400 hidden mt-1 block">
                    Format NIS harus 8 digit angka!
                </span>
            </div>

            <!-- Nama -->
            <div>
                <label
                    for="nama"
                    class="block text-xs font-semibold uppercase mb-1 text-slate-300">
                    Nama Lengkap
                </label>

                <input
                    type="text"
                    id="nama"
                    required
                    placeholder="Masukkan nama lengkap"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>

            <!-- Divisi -->
            <div>
                <label
                    for="divisi"
                    class="block text-xs font-semibold uppercase mb-1 text-slate-300">
                    Pilihan Divisi
                </label>

                <select
                    id="divisi"
                    required
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">

                    <option value="">-- Pilih Divisi --</option>
                    <option value="Web Development">
                        Web Development (PHP/Tailwind)
                    </option>
                    <option value="Mobile App">
                        Mobile App (Flutter)
                    </option>
                    <option value="Data Science & AI">
                        Data Science & AI (Python)
                    </option>
                </select>
            </div>

            <!-- Email -->
            <div>
                <label
                    for="email"
                    class="block text-xs font-semibold uppercase mb-1 text-slate-300">
                    Email Aktif
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="nama@siswa.smk.sch.id"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>

            <!-- Submit -->
            <button
                type="submit"
                id="btnSubmit"
                class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-lg transition duration-200 text-sm">

                KIRIM PENDAFTARAN
            </button>

        </form>

        <!-- Response -->
        <div
            id="responseMessage"
            class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium">
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
